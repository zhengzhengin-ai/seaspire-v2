<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact POST Test</title>
</head>

<body>

<h1>Native POST Test</h1>

<form action="https://www.seaspirephuket.com/contact.php" method="POST">

  <label>
    Company
    <input 
      type="text" 
      name="company" 
      value="Native Test Company"
    >
  </label>

  <br><br>

  <label>
    Contact
    <input 
      type="text" 
      name="contact" 
      value="Jack"
    >
  </label>

  <br><br>

  <label>
    Email
    <input 
      type="email" 
      name="email" 
      value="test@seaspire.com"
    >
  </label>

  <br><br>

  <label>
    Country
    <input 
      type="text" 
      name="country" 
      value="Taiwan"
    >
  </label>

  <br><br>

  <label>
    Message
    <textarea name="message">
Native POST test
    </textarea>
  </label>

  <br><br>

  <button type="submit">
    Submit
  </button>

</form>


</body>
</html>
